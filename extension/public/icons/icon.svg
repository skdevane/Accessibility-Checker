<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#1e1b4b"/>
  <!-- Glow -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3"/>
  <!-- Head -->
  <circle cx="64" cy="34" r="10" fill="white"/>
  <!-- Body -->
  <line x1="64" y1="44" x2="64" y2="80" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="30" y1="58" x2="98" y2="58" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="64" y1="80" x2="42" y2="108" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="64" y1="80" x2="86" y2="108" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Green dot (check) -->
  <circle cx="96" cy="96" r="14" fill="#22c55e"/>
  <polyline points="89,96 94,102 104,89" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
